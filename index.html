<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Command — Destiny 2 Loadout Manager</title>
<style>
:root{
  --bg:#0d0f14; --panel:#161a22; --panel2:#1c212c; --line:#2a3140;
  --txt:#e8eaf0; --dim:#9aa3b5; --accent:#f5b83d; --good:#59d98c; --bad:#e5645f;
  --exotic:#ceae33; --legendary:#7c4f96; --rare:#5076a3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
h3{font-size:14px;margin:14px 0 8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#14100a;border-color:var(--accent)}
.btn.danger{border-color:#6b3a38;color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:500}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(13,15,20,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 18px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.brand em{color:var(--accent);font-style:normal}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
#charTabs{display:flex;gap:8px}
.ctab{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.ctab.active{border-color:var(--accent);background:var(--panel2)}
.ctab .em{font-size:20px}
.ctab .nm{font-weight:700;font-size:13px;text-align:left;line-height:1.2}
.ctab .pw{font-size:11px;color:var(--accent);font-weight:600}
.searchwrap{flex:1;min-width:220px;position:relative}
#searchBox{width:100%;padding:8px 90px 8px 12px}
#matchCount{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim)}
nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav .tab{padding:7px 14px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
nav .tab.active{color:var(--txt);border-color:var(--accent)}
.gear{font-size:18px;padding:6px}

main{max-width:1200px;margin:0 auto;padding:8px 18px}

/* item tiles */
.row{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.rowlabel{width:88px;flex-shrink:0;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding-top:8px}
.eqslot{flex-shrink:0}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.item{position:relative;width:52px;height:52px;background:var(--panel2);border:2px solid var(--line);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;user-select:none}
.item.big{width:66px;height:66px;font-size:30px}
.item:hover{transform:scale(1.06);z-index:2}
.item.t-Exotic{border-color:var(--exotic);background:linear-gradient(160deg,#2b2510,var(--panel2))}
.item.t-Legendary{border-color:var(--legendary);background:linear-gradient(160deg,#241a2c,var(--panel2))}
.item.t-Rare{border-color:var(--rare)}
.item.equipped{outline:2px solid var(--accent);outline-offset:2px}
.item.dimmed{opacity:.14;filter:grayscale(1)}
.item .pow{position:absolute;bottom:0;right:0;font-size:9px;font-weight:700;background:rgba(0,0,0,.75);padding:0 3px;border-radius:3px 0 3px 0;color:#ffd97a}
.item .el{position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.5)}
.item .tg{position:absolute;top:-1px;right:1px;font-size:10px}
.item .lk{position:absolute;bottom:0;left:1px;font-size:9px}
.item .cls{position:absolute;top:1px;right:2px;font-size:8px;font-weight:800;color:var(--dim)}
.emptyslot{width:66px;height:66px;border:2px dashed var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:11px}
.dropzone.dragover{outline:2px dashed var(--accent);outline-offset:4px;border-radius:8px}

/* cards & chips */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.sel{border-color:var(--accent)}
.card h4{font-size:15px;display:flex;align-items:center;gap:8px}
.card .cat{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.card p{font-size:12px;color:var(--dim);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.chip.champ{border-color:#8a4b45;color:#f0a09b}
.chip.surge{border-color:#7a6a2e;color:#ffd97a}

/* stats */
.statrow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.statrow .sn{width:80px;color:var(--dim)}
.statrow .bar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.statrow .bar i{display:block;height:100%;background:var(--accent)}
.statrow .sv{width:30px;text-align:right;font-weight:700}

/* overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px}
#overlay.show{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:460px;overflow:hidden}
.panel.wide{max-width:840px}
.phead{padding:14px 18px;border-bottom:1px solid var(--line)}
.phead.t-Exotic{background:linear-gradient(120deg,#3d3413,var(--panel))}
.phead.t-Legendary{background:linear-gradient(120deg,#31203d,var(--panel))}
.phead.t-Rare{background:linear-gradient(120deg,#1e2c3d,var(--panel))}
.phead h3{margin:0;font-size:18px}
.phead .sub{font-size:12px;color:var(--dim)}
.pbody{padding:16px 18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tagbtns{display:flex;gap:6px;margin-top:10px}
.tagbtns button{font-size:16px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;opacity:.45}
.tagbtns button.on{opacity:1;border-color:var(--accent);background:var(--panel2)}
.perk{display:inline-block;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:2px 9px;margin:2px 3px 2px 0}

/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.08em;cursor:pointer;white-space:nowrap;user-select:none}
tr:hover td{background:var(--panel2)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px 10px}
.bulkbar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;font-size:12px;color:var(--dim)}

/* misc */
.banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--dim);margin:14px 0}
.banner b{color:var(--txt)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#242b38;border:1px solid var(--accent);padding:10px 20px;border-radius:8px;font-weight:600;display:none;z-index:200;max-width:90vw}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--dim);font-size:12px}
.why{font-size:11px;color:var(--good);margin-top:3px}
.recblock{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.recpick{width:150px}
.recpick .nm{font-size:12px;font-weight:700;margin-top:4px}
label.opt{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.field{margin:10px 0}
.field label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.field select,.field input[type=text]{width:100%}
.tiers{display:flex;gap:4px;margin:8px 0}
.tierbox{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;text-align:center}
.tierbox b{display:block;font-size:15px;color:var(--accent)}
@media(max-width:640px){.rowlabel{width:58px;font-size:9px}.item{width:46px;height:46px;font-size:19px}.item.big,.emptyslot{width:56px;height:56px}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand"><em>◆</em> VAULT COMMAND<small>Destiny 2 Loadout Manager</small></div>
    <div id="charTabs"></div>
    <div class="searchwrap">
      <input id="searchBox" type="text" placeholder='Search: is:exotic  slot:power  element:solar  type:handcannon  power:>2000  tag:favorite  -is:junk' autocomplete="off">
      <span id="matchCount"></span>
    </div>
    <button class="gear" data-act="settings" title="Settings">⚙️</button>
  </div>
  <nav id="navTabs"></nav>
</header>

<main id="view"></main>
<div id="overlay"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>

 });

 });
 // guarantee every character can equip every slot
 CHARS.forEach(c=>{

/* ============================== search language ============================== */
function tokenPred(t){
 const m=t.match(/^([a-z]+):(.+)$/);
 if(!m){
  return i=>((i.name+' '+i.type+' '+(i.perks||[]).join(' ')+' '+(i.notes||'')).toLowerCase().includes(t));
 }
 const k=m[1],v=m[2];
 switch(k){
  case 'is':
   switch(v){
    case 'weapon':return i=>i.itemType==='weapon';
    case 'armor':return i=>i.itemType==='armor';
    case 'exotic':return i=>i.tier==='Exotic';
    case 'legendary':return i=>i.tier==='Legendary';
    case 'rare':return i=>i.tier==='Rare';
    case 'locked':return i=>!!i.locked;
    case 'equipped':return i=>!!i.equipped;
    case 'tagged':return i=>!!i.tag;
    default:return function(){return false;};
   }
  case 'slot':return i=>i.slot===v;
  case 'type':return i=>i.type.toLowerCase().replace(/\s+/g,'')===v.replace(/\s+/g,'');
  case 'element':return i=>i.element===v;
  case 'class':return i=>i.classType===v;
  case 'tag':return v==='none'?(i=>!i.tag):(i=>i.tag===v);
  case 'perk':return i=>(i.perks||[]).join(' ').toLowerCase().includes(v);
  case 'name':return i=>i.name.toLowerCase().includes(v);
  case 'owner':{
   const map={vault:'vault',titan:'c_titan',hunter:'c_hunter',warlock:'c_warlock'};
   return i=>i.owner===(map[v]||v);
  }
  case 'power':{
   const pm=v.match(/^(>=|<=|>|<|=)?(\d+)$/);
   if(!pm)return function(){return false;};
   const op=pm[1]||'=',n=+pm[2];
   return i=>op==='>'?i.power>n:op==='<'?i.power<n:op==='>='?i.power>=n:op==='<='?i.power<=n:i.power===n;
  }
  default:return i=>((i.name+' '+i.type).toLowerCase().includes(t));
 }
}
function makeFilter(q){
 const preds=q.toLowerCase().split(/\s+/).filter(Boolean).map(t=>{
  let neg=false; if(t.startsWith('-')){neg=true;t=t.slice(1);}
  if(!t)return function(){return true;};
  const p=tokenPred(t);
  return neg?(i=>!p(i)):p;
 });
 if(!preds.length)return null;
 return i=>preds.every(p=>p(i));
}

/* ============================== core actions ============================== */
function bestReplacement(it){
 return state.items.filter(r=>r.owner===it.owner&&r.slot===it.slot&&!r.equipped&&r.id!==it.id
   &&(r.itemType==='weapon'||r.classType===getChar(it.owner).cls))
  .sort((a,b)=>b.power-a.power)[0]||null;
}
function moveItem(it,dest){
 if(typeof it==='string')it=item(it);
 if(!it||it.owner===dest)return true;
 if(dest!=='vault'){
  const c=getChar(dest);
  if(it.itemType==='armor'&&it.classType!==c.cls){toast(it.name+' can only be used by a '+cap(it.classType));return false;}
 }
 if(it.equipped){
  const rep=bestReplacement(it);
  if(!rep){toast('Cannot move '+it.name+' — nothing else to equip in that slot');return false;}
  it.equipped=false; rep.equipped=true;
 }
 it.owner=dest;
 return true;
}
function equipItem(it,charId){
 if(typeof it==='string')it=item(it);
 if(!it)return false;
 const c=getChar(charId);
 if(it.itemType==='armor'&&it.classType!==c.cls){toast(it.name+' is '+cap(it.classType)+'-only');return false;}
 if(it.owner!==charId&&!moveItem(it,charId))return false;
 state.items.forEach(o=>{if(o.owner===charId&&o.slot===it.slot&&o.equipped)o.equipped=false;});
 if(it.tier==='Exotic'){
  state.items.forEach(o=>{
   if(o.owner===charId&&o.equipped&&o.tier==='Exotic'&&o.itemType===it.itemType&&o.slot!==it.slot){
    o.equipped=false;
    const rep=state.items.filter(r=>r.owner===charId&&r.slot===o.slot&&!r.equipped&&r.tier!=='Exotic'&&r.id!==it.id)
      .sort((a,b)=>b.power-a.power)[0];
    if(rep)rep.equipped=true;
   }
  });
 }
 it.equipped=true;
 return true;
}
function applyLoadout(itemIds,charId,name){
 const c=getChar(charId);
 const list=itemIds.map(id=>item(id)).filter(Boolean)
  .filter(i=>i.itemType==='weapon'||i.classType===c.cls);
 list.forEach(i=>{if(i.owner!==charId)moveItem(i,charId);});
 list.forEach(i=>{if(i.owner===charId)equipItem(i,charId);});
 save();renderAll();

}
function maxPower(charId){
 const c=getChar(charId);let t=0;
 SLOTS.forEach(s=>{
  const cand=state.items.filter(i=>i.slot===s&&(i.itemType==='weapon'||i.classType===c.cls));
  if(cand.length)t+=Math.max.apply(null,cand.map(i=>i.power));
 });
 return (t/8).toFixed(1);
}
function sortItems(arr){
 const s=state.settings.sort;
 return arr.slice().sort((a,b)=>{
  if(s==='name')return a.name.localeCompare(b.name);
  if(s==='tier'){const o={Exotic:0,Legendary:1,Rare:2};return(o[a.tier]-o[b.tier])||b.power-a.power;}
  return b.power-a.power;
 });
}

/* ============================== recommendation engine ============================== */
function scoreWeapon(w,act){
 let s=(w.power-1985)*1.5; const why=[];
 if(act.surges&&act.surges.indexOf(w.element)>=0){s+=30;why.push(cap(w.element)+' surge active (+25% dmg)');}
 if(act.champions&&act.champions.length){
  for(let x=0;x<act.champions.length;x++){
   const ch=act.champions[x];
   if(w.champ===ch){s+=45;why.push('Intrinsically stuns '+cap(ch)+' Champions');break;}
   if(CHAMPION_COUNTERS[ch].indexOf(w.type)>=0){s+=35;why.push('Counters '+cap(ch)+' Champions (seasonal mod)');break;}
  }
 }
 const role=act.roles&&act.roles[w.slot];
 if(role&&ROLES[role].types.indexOf(w.type)>=0){s+=25;why.push(ROLES[role].label);}
 if(w.tier==='Exotic')s+=10;
 if(w.tag==='favorite'){s+=15;why.push('Tagged ★ favorite');}
 if(w.tag==='junk')s-=200;
 if(w.tag==='archive')s-=100;
 return{s:s,why:why};
}
function armorScore(a,weights){
 let s=(a.power-1985)*0.6;
 if(a.stats)STATS.forEach(k=>s+=(a.stats[k]||0)*(weights[k]||0));
 if(a.tag==='favorite')s+=5;
 if(a.tag==='junk')s-=200;
 return s;
}
function optimizeArmor(cls,weights,requiredExoticId){
 const bySlot={};
 ARMOR_SLOTS.forEach(sl=>{
  bySlot[sl]=state.items.filter(i=>i.slot===sl&&i.classType===cls&&i.tag!=='junk')
   .map(i=>({i:i,sc:armorScore(i,weights)})).sort((a,b)=>b.sc-a.sc);
 });
 if(ARMOR_SLOTS.some(sl=>!bySlot[sl].length))return null;
 const bestLeg={},bestExo={};
 ARMOR_SLOTS.forEach(sl=>{
  bestLeg[sl]=bySlot[sl].find(x=>x.i.tier!=='Exotic')||null;
  bestExo[sl]=bySlot[sl].find(x=>x.i.tier==='Exotic')||null;
 });
 const combos=[];
 const req=requiredExoticId?item(requiredExoticId):null;
 if(req){
  if(ARMOR_SLOTS.every(sl=>sl===req.slot||bestLeg[sl])){
   combos.push(ARMOR_SLOTS.map(sl=>sl===req.slot?{i:req,sc:armorScore(req,weights)}:bestLeg[sl]));
  }
 }else{
  if(ARMOR_SLOTS.every(sl=>bestLeg[sl]))combos.push(ARMOR_SLOTS.map(sl=>bestLeg[sl]));
  ARMOR_SLOTS.forEach(exSl=>{
   if(bestExo[exSl]&&ARMOR_SLOTS.every(sl=>sl===exSl||bestLeg[sl]))
    combos.push(ARMOR_SLOTS.map(sl=>sl===exSl?bestExo[exSl]:bestLeg[sl]));
  });
 }
 if(!combos.length)return null;
 let best=combos[0],bestSum=-1e9;
 combos.forEach(c=>{const sum=c.reduce((t,x)=>t+x.sc,0);if(sum>bestSum){bestSum=sum;best=c;}});
 const totals={};STATS.forEach(k=>totals[k]=0);
 best.forEach(x=>{if(x.i.stats)STATS.forEach(k=>totals[k]+=x.i.stats[k]||0);});
 return{pieces:best.map(x=>x.i),totals:totals,score:bestSum};
}
function recommendLoadout(actId,charId){
 const act=ACTIVITIES.find(a=>a.id===actId);
 const c=getChar(charId);
 let weaponPicks=[];
 WEAPON_SLOTS.forEach(sl=>{
  const cands=state.items.filter(i=>i.itemType==='weapon'&&i.slot===sl);
  if(!cands.length)return;
  const scored=cands.map(w=>{const r=scoreWeapon(w,act);return{w:w,s:r.s,why:r.why};}).sort((a,b)=>b.s-a.s);
  weaponPicks.push(scored[0]);
 });
 // enforce one exotic weapon: keep the highest-scored exotic, swap the rest
 const exos=weaponPicks.filter(p=>p.w.tier==='Exotic').sort((a,b)=>b.s-a.s);
 for(let n=1;n<exos.length;n++){
  const p=exos[n];
  const alt=state.items.filter(i=>i.itemType==='weapon'&&i.slot===p.w.slot&&i.tier!=='Exotic')
   .map(w=>{const r=scoreWeapon(w,act);return{w:w,s:r.s,why:r.why};}).sort((a,b)=>b.s-a.s)[0];
  if(alt){const idx=weaponPicks.indexOf(p);weaponPicks[idx]=alt;alt.why.push('Swapped in (one exotic weapon max)');}
 }
 const armor=optimizeArmor(c.cls,act.statW,null);
 const armorPicks=armor?armor.pieces.map(a=>{
  const why=[];
  if(a.stats){
   const top=STATS.filter(k=>act.statW[k]>0).sort((x,y)=>(a.stats[y]||0)-(a.stats[x]||0)).slice(0,2)
    .map(k=>STAT_LABEL[k]+' '+a.stats[k]);
   if(top.length)why.push(top.join(' · '));
  }
  if(a.tier==='Exotic')why.push('Best-in-slot exotic for this stat spread');
  return{w:a,why:why};
 }):[];
 const ids=weaponPicks.map(p=>p.w.id).concat(armorPicks.map(p=>p.w.id));
 return{act:act,char:c,weaponPicks:weaponPicks,armorPicks:armorPicks,totals:armor?armor.totals:null,ids:ids};
}

  let va=a[key],vb=b[key];
  if(key==='owner'){va=a.owner==='vault'?'Vault':getChar(a.owner).name;vb=b.owner==='vault'?'Vault':getChar(b.owner).name;}
  if(typeof va==='string'||typeof vb==='string')return dir*String(va||'').localeCompare(String(vb||''));
  return dir*((va||0)-(vb||0));
 });
 const selN=state.orgSel.size;
 let h='<h2>Organizer — '+its.length+' items</h2>'
  +'<div class="bulkbar"><span>'+(selN?selN+' selected:':'Select items for bulk actions')+'</span>'
  +(selN?['favorite','keep','infuse','junk','archive'].map(t=>'<button class="btn sm" data-act="bulkTag" data-v="'+t+'">'+TAG_ICON[t]+' '+cap(t)+'</button>').join('')
   +'<button class="btn sm" data-act="bulkTag" data-v="">Clear tag</button>'
   +'<button class="btn sm" data-act="bulkLock">🔒 Lock/Unlock</button>'
   +'<button class="btn sm" data-act="bulkVault">📦 To vault</button>'
   +'<button class="btn sm" data-act="bulkClear">✕ Deselect</button>':'')
  +'</div><div class="tablewrap"><table><thead><tr><th></th>'
  +[['name','Name'],['tier','Tier'],['type','Type'],['element','Element'],['power','Power'],['owner','Owner'],['tag','Tag'],['locked','🔒'],['notes','Notes']]
   .map(kl=>'<th data-act="sortOrg" data-key="'+kl[0]+'">'+kl[1]+(key===kl[0]?(dir>0?' ▲':' ▼'):'')+'</th>').join('')
  +'</tr></thead><tbody>';
 its.forEach(i=>{
  h+='<tr><td><input type="checkbox" data-chg="orgSel" data-id="'+i.id+'"'+(state.orgSel.has(i.id)?' checked':'')+'></td>'
   +'<td><a href="#" data-act="openItem" data-id="'+i.id+'" style="color:'+(i.tier==='Exotic'?'var(--exotic)':i.tier==='Legendary'?'#c79ce0':'var(--txt)')+'">'+esc(i.name)+'</a></td>'
   +'<td>'+i.tier+'</td><td>'+i.type+'</td><td>'+(i.element?cap(i.element):'—')+'</td><td>'+i.power+'</td>'
   +'<td>'+(i.owner==='vault'?'Vault':getChar(i.owner).name)+(i.equipped?' ⚡':'')+'</td>'
   +'<td>'+(i.tag?TAG_ICON[i.tag]+' '+cap(i.tag):'—')+'</td><td>'+(i.locked?'🔒':'')+'</td>'
   +'<td class="muted">'+esc(i.notes||'')+'</td></tr>';
 });
 h+='</tbody></table></div>';
 return h;
}
function renderChars(){
 document.getElementById('charTabs').innerHTML=CHARS.map(c=>
  '<button class="ctab dropzone'+(state.activeChar===c.id?' active':'')+'" data-act="char" data-id="'+c.id+'" data-drop="'+c.id+'">'
  +'<span class="em">'+c.em+'</span><span class="nm">'+c.name+'<br><span class="pw">✦ '+maxPower(c.id)+'</span></span></button>').join('');
}
function renderNav(){
 const tabs=[['inventory','Inventory'],['missions','🎮 Missions'],['loadouts','Loadouts'],['optimizer','Optimizer'],['organizer','Organizer']];
 document.getElementById('navTabs').innerHTML=tabs.map(t=>
  '<button class="tab'+(state.view===t[0]?' active':'')+'" data-act="view" data-v="'+t[0]+'">'+t[1]+'</button>').join('');
}
function renderView(){
 const map={inventory:renderInventory,loadouts:renderLoadouts,optimizer:renderOptimizer,missions:renderMissions,organizer:renderOrganizer};
 document.getElementById('view').innerHTML=map[state.view]();
 const flt=makeFilter(state.q);
 document.getElementById('matchCount').textContent=flt?state.items.filter(flt).length+' match':'';
}
function renderAll(){renderChars();renderNav();renderView();}

/* ============================== modals ============================== */
const overlay=document.getElementById('overlay');
function openModal(html){overlay.innerHTML=html;overlay.classList.add('show');}
function closeModal(){overlay.classList.remove('show');overlay.innerHTML='';}
function openItem(id){
 const it=item(id);if(!it)return;
 const owner=it.owner==='vault'?'Vault':getChar(it.owner).name;
 let body='';
 if(it.itemType==='weapon'){
  body='<div style="margin:8px 0">'+(it.perks||[]).map(p=>'<span class="perk">'+esc(p)+'</span>').join('')
   +(it.mw?'<span class="perk" style="border-color:var(--exotic)">✦ '+esc(it.mw)+'</span>':'')+'</div>';
  if(it.champ)body+='<p class="muted">Intrinsic: stuns '+cap(it.champ)+' Champions</p>';
 }else if(it.stats){
  body=statBars(it.stats,null);
 }
 const moveBtns=['vault','c_titan','c_hunter','c_warlock'].filter(d=>d!==it.owner)
  .filter(d=>d==='vault'||it.itemType==='weapon'||getChar(d).cls===it.classType)
  .map(d=>'<button class="btn sm" data-act="move" data-id="'+it.id+'" data-to="'+d+'">→ '+(d==='vault'?'Vault':getChar(d).name)+'</button>').join('');
 openModal('<div class="panel"><div class="phead t-'+it.tier+'"><div class="flex spread"><div><h3>'+esc(it.name)+'</h3>'
  +'<div class="sub">'+it.tier+' '+esc(it.type)+(it.element?' · '+cap(it.element):'')+(it.classType?' · '+cap(it.classType):'')+' · ✦ '+it.power+' · '+owner+(it.equipped?' (equipped)':'')+'</div></div>'
  +'<button data-act="close" style="font-size:18px">✕</button></div></div>'
  +'<div class="pbody">'+body
  +'<div class="tagbtns">'+Object.keys(TAG_ICON).map(t=>'<button class="'+(it.tag===t?'on':'')+'" data-act="tag" data-id="'+it.id+'" data-v="'+t+'" title="'+cap(t)+'">'+TAG_ICON[t]+'</button>').join('')+'</div>'
  +'<div class="field" style="margin-top:12px"><label>Notes</label><textarea data-chg="notes" data-id="'+it.id+'" rows="2" style="width:100%" placeholder="e.g. god roll, keep for GM">'+esc(it.notes||'')+'</textarea></div>'
  +'<div class="actions"><button class="btn primary sm" data-act="equip" data-id="'+it.id+'">⚡ Equip on '+getChar(state.activeChar).name+'</button>'
  +moveBtns
  +'<button class="btn sm" data-act="lock" data-id="'+it.id+'">'+(it.locked?'🔓 Unlock':'🔒 Lock')+'</button>'
  +'<button class="btn sm" data-act="compare" data-id="'+it.id+'">⚖ Compare</button></div>'
  +'</div></div>');
}
function openCompare(id){
 const it=item(id);
 const peers=state.items.filter(p=>it.itemType==='weapon'?(p.itemType==='weapon'&&p.type===it.type)
  :(p.itemType==='armor'&&p.slot===it.slot&&p.classType===it.classType)).sort((a,b)=>b.power-a.power);
 let head,rows;
 if(it.itemType==='weapon'){
  head='<tr><th>Name</th><th>Tier</th><th>Element</th><th>Power</th><th>Perks</th><th>Owner</th></tr>';
  rows=peers.map(p=>'<tr'+(p.id===id?' style="outline:1px solid var(--accent)"':'')+'><td>'+esc(p.name)+'</td><td>'+p.tier+'</td><td>'+cap(p.element)+'</td><td>'+p.power+'</td><td>'+esc((p.perks||[]).join(', '))+'</td><td>'+(p.owner==='vault'?'Vault':getChar(p.owner).name)+'</td></tr>').join('');
 }else{
  const maxes={};STATS.forEach(k=>maxes[k]=Math.max.apply(null,peers.map(p=>p.stats?p.stats[k]||0:0)));
  head='<tr><th>Name</th><th>Tier</th><th>Power</th>'+STATS.map(k=>'<th>'+STAT_LABEL[k].slice(0,3)+'</th>').join('')+'<th>Total</th></tr>';
  rows=peers.map(p=>{
   const tot=p.stats?STATS.reduce((t,k)=>t+(p.stats[k]||0),0):0;
   return '<tr'+(p.id===id?' style="outline:1px solid var(--accent)"':'')+'><td>'+esc(p.name)+'</td><td>'+p.tier+'</td><td>'+p.power+'</td>'
    +STATS.map(k=>{const v=p.stats?p.stats[k]||0:0;return '<td style="'+(v&&v===maxes[k]?'color:var(--good);font-weight:700':'')+'">'+v+'</td>';}).join('')
    +'<td><b>'+tot+'</b></td></tr>';}).join('');
 }
 openModal('<div class="panel wide"><div class="phead"><div class="flex spread"><h3>⚖ Compare — '+esc(it.itemType==='weapon'?it.type:cap(it.classType)+' '+SLOT_LABEL[it.slot])+'</h3><button data-act="close" style="font-size:18px">✕</button></div></div>'
  +'<div class="pbody"><div style="overflow-x:auto"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div></div></div>');
}
function loadoutSlotField(sl,cls,curId){
 const opts=state.items.filter(i=>i.slot===sl&&(i.itemType==='weapon'||i.classType===cls))
  .sort((a,b)=>b.power-a.power)
  .map(i=>'<option value="'+i.id+'"'+(curId===i.id?' selected':'')+'>'+esc(i.name)+' ('+i.power+')</option>').join('');
 return '<div class="field"><label>'+SLOT_LABEL[sl]+'</label><select data-lslot="'+sl+'"><option value="">— skip —</option>'+opts+'</select></div>';
}
function openLoadoutEditor(lid){
 const l=lid?state.loadouts.find(x=>x.id===lid):null;
 const cls=l?l.classType:getChar(state.activeChar).cls;
 const cur={};(l?l.items:[]).forEach(id=>{const i=item(id);if(i)cur[i.slot]=i.id;});
 openModal('<div class="panel"><div class="phead"><div class="flex spread"><h3>'+(l?'Edit':'New')+' loadout</h3><button data-act="close" style="font-size:18px">✕</button></div></div>'
  +'<div class="pbody"><div class="field"><label>Name</label><input type="text" id="loName" value="'+esc(l?l.name:'')+'" placeholder="e.g. GM Solar Titan"></div>'
  +'<div class="field"><label>Class</label><select id="loClass" data-chg="loClass">'+CHARS.map(c=>'<option value="'+c.cls+'"'+(cls===c.cls?' selected':'')+'>'+c.name+'</option>').join('')+'</select></div>'
  +'<div id="loSlots">'+SLOTS.map(sl=>loadoutSlotField(sl,cls,cur[sl])).join('')+'</div>'
  +'<div class="actions"><button class="btn primary" data-act="saveLoadoutForm" data-id="'+(l?l.id:'')+'">Save loadout</button></div></div></div>');
}
function rebuildLoadoutSlots(){
 const cls=document.getElementById('loClass').value;
 document.getElementById('loSlots').innerHTML=SLOTS.map(sl=>loadoutSlotField(sl,cls,null)).join('');
}
function openSettings(){
 openModal('<div class="panel"><div class="phead"><div class="flex spread"><h3>⚙ Settings</h3><button data-act="close" style="font-size:18px">✕</button></div></div>'
  +'<div class="pbody">'
  +'<div class="field"><label>Item sort order</label><select data-chg="setSort">'
  +[['power','Power (high → low)'],['name','Name (A → Z)'],['tier','Rarity, then power']]
   .map(o=>'<option value="'+o[0]+'"'+(state.settings.sort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'
  +'<label class="opt"><input type="checkbox" data-chg="autoApply"'+(state.settings.autoApply?' checked':'')+'> Auto-equip loadout when selecting a mission</label>'
  +'<h3 style="margin-top:18px">Backup</h3>'
  +'<div class="actions"><button class="btn sm" data-act="exportData">⬇ Export data (JSON)</button>'
  +'<button class="btn sm" data-act="importClick">⬆ Import backup</button>'
  +'<button class="btn sm danger" data-act="resetData">↺ Reset demo data</button></div>'
  +'<h3 style="margin-top:18px">Connect your real Bungie account</h3>'
  +'<p class="muted">This build runs on demo data so every feature works instantly. Live sync with your actual Destiny 2 characters works exactly like DIM: register an application at <b>bungie.net/en/Application</b> to get an API key + OAuth client, sign in with your Bungie account, and the app can then read your real inventory and equip/transfer items through the Bungie.net API. Everything here — search, loadouts, optimizer, mission auto-equip — is built to run on top of that once connected.</p>'
  +'</div></div>');
}
function toast(msg){
 const t=document.getElementById('toast');
 t.textContent=msg;t.style.display='block';
 clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none';},2600);
}

/* ============================== events ============================== */
function selectActivity(id){
 state.selectedActivity=id;
 if(state.settings.autoApply){
  const rec=recommendLoadout(id,state.activeChar);
  applyLoadout(rec.ids,state.activeChar,rec.act.name+' auto-loadout');
 }
 renderView();
}
function handleAction(d){
 switch(d.act){
  case 'view':state.view=d.v;renderAll();break;
  case 'char':state.activeChar=d.id;save();renderAll();break;
  case 'settings':openSettings();break;
  case 'close':closeModal();break;
  case 'openItem':openItem(d.id);break;
  case 'equip':if(equipItem(d.id,state.activeChar)){save();closeModal();renderAll();toast('Equipped');}break;
  case 'move':if(moveItem(d.id,d.to)){save();closeModal();renderAll();toast('Transferred');}break;
  case 'lock':{const i=item(d.id);i.locked=!i.locked;save();openItem(d.id);renderView();break;}
  case 'tag':{const i=item(d.id);i.tag=i.tag===d.v?null:d.v;save();openItem(d.id);renderView();break;}
  case 'compare':openCompare(d.id);break;
  case 'newLoadout':openLoadoutEditor(null);break;
  case 'editLoadout':openLoadoutEditor(d.id);break;
  case 'delLoadout':state.loadouts=state.loadouts.filter(l=>l.id!==d.id);save();renderView();toast('Loadout deleted');break;
  case 'applyLoadout':{
   const l=state.loadouts.find(x=>x.id===d.id);
   const ch=CHARS.find(c=>c.cls===l.classType)||getChar(state.activeChar);
   state.activeChar=ch.id;
   applyLoadout(l.items,ch.id,l.name);break;}
  case 'saveEquipped':{
   const c=getChar(state.activeChar);
   const eq=state.items.filter(i=>i.owner===c.id&&i.equipped).map(i=>i.id);
   state.loadouts.push({id:uid(),name:c.name+' — current gear',classType:c.cls,items:eq});
   save();renderView();toast('Saved current equipment as loadout');break;}
  case 'saveLoadoutForm':{
   const name=document.getElementById('loName').value.trim()||'Unnamed loadout';
   const cls=document.getElementById('loClass').value;
   const ids=Array.prototype.slice.call(overlay.querySelectorAll('[data-lslot]')).map(s=>s.value).filter(Boolean);
   if(d.id){const l=state.loadouts.find(x=>x.id===d.id);l.name=name;l.classType=cls;l.items=ids;}
   else state.loadouts.push({id:uid(),name:name,classType:cls,items:ids});
   save();closeModal();state.view='loadouts';renderAll();toast('Loadout saved');break;}
  case 'optimize':{
   const c=getChar(state.activeChar);
   state.optResult=optimizeArmor(c.cls,state.optWeights,state.optExotic||null);
   if(!state.optResult)toast('Not enough armor for this class');
   renderView();break;}
  case 'applyOpt':applyLoadout(state.optResult.pieces.map(p=>p.id),state.activeChar,'Optimized build');break;
  case 'saveOpt':{
   const c=getChar(state.activeChar);
   state.loadouts.push({id:uid(),name:'Optimized '+c.name+' build',classType:c.cls,items:state.optResult.pieces.map(p=>p.id)});
   save();toast('Saved as loadout');break;}
  case 'selectAct':selectActivity(d.id);break;
  case 'applyRec':{
   const rec=recommendLoadout(state.selectedActivity,state.activeChar);
   applyLoadout(rec.ids,state.activeChar,rec.act.name+' loadout');break;}
  case 'saveRec':{
   const rec=recommendLoadout(state.selectedActivity,state.activeChar);
   state.loadouts.push({id:uid(),name:rec.act.name+' — '+rec.char.name,classType:rec.char.cls,items:rec.ids});
   save();toast('Saved as loadout');break;}
  case 'sortOrg':{
   if(state.orgSort.key===d.key)state.orgSort.dir*=-1;
   else state.orgSort={key:d.key,dir:d.key==='power'?-1:1};
   renderView();break;}
  case 'bulkTag':state.orgSel.forEach(id=>{const i=item(id);if(i)i.tag=d.v||null;});save();renderView();toast('Updated '+state.orgSel.size+' items');break;
  case 'bulkLock':{
   let any=false;state.orgSel.forEach(id=>{const i=item(id);if(i&&!i.locked)any=true;});
   state.orgSel.forEach(id=>{const i=item(id);if(i)i.locked=any;});save();renderView();break;}
  case 'bulkVault':{let n=0;state.orgSel.forEach(id=>{const i=item(id);if(i&&moveItem(i,'vault'))n++;});save();renderView();toast(n+' items sent to vault');break;}
  case 'bulkClear':state.orgSel.clear();renderView();break;
  case 'exportData':{
   const blob=new Blob([JSON.stringify({items:state.items,loadouts:state.loadouts,settings:state.settings},null,1)],{type:'application/json'});
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vault-command-backup.json';a.click();break;}
  case 'importClick':document.getElementById('importFile').click();break;
  case 'resetData':
   if(confirm('Reset all items, tags, notes and loadouts back to fresh demo data?')){
    localStorage.removeItem(LS);initState();closeModal();renderAll();toast('Demo data reset');
   }break;
 }
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(el){e.preventDefault();handleAction(el.dataset);return;}
 if(e.target===overlay){closeModal();return;}
 const tile=e.target.closest('.item[data-id]');
 if(tile)openItem(tile.dataset.id);
});
document.addEventListener('dblclick',e=>{
 const tile=e.target.closest('.item[data-id]');
 if(tile){if(equipItem(tile.dataset.id,state.activeChar)){save();renderAll();toast('Equipped');}}
});
document.addEventListener('change',e=>{
 const el=e.target,c=el.dataset.chg;
 if(!c){
  if(el.id==='importFile'&&el.files[0]){
   const fr=new FileReader();
   fr.onload=()=>{try{
    const d=JSON.parse(fr.result);
    if(!Array.isArray(d.items))throw new Error('bad');
    state.items=d.items;state.loadouts=d.loadouts||[];Object.assign(state.settings,d.settings||{});
    save();closeModal();renderAll();toast('Backup imported');
   }catch(err){toast('Invalid backup file');}};
   fr.readAsText(el.files[0]);el.value='';
  }
  return;
 }
 switch(c){
  case 'notes':{const i=item(el.dataset.id);if(i){i.notes=el.value;save();}break;}
  case 'setSort':state.settings.sort=el.value;save();renderView();break;
  case 'autoApply':
   state.settings.autoApply=el.checked;save();
   if(el.checked&&state.selectedActivity&&state.view==='missions'){
    const rec=recommendLoadout(state.selectedActivity,state.activeChar);
    applyLoadout(rec.ids,state.activeChar,rec.act.name+' auto-loadout');
   }break;
  case 'optExotic':state.optExotic=el.value;break;
  case 'optW':state.optWeights[el.dataset.stat]=+el.value;break;
  case 'loClass':rebuildLoadoutSlots();break;
  case 'orgSel':if(el.checked)state.orgSel.add(el.dataset.id);else state.orgSel.delete(el.dataset.id);renderView();break;
 }
});
document.getElementById('searchBox').addEventListener('input',e=>{state.q=e.target.value;renderView();});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
  e.preventDefault();document.getElementById('searchBox').focus();
 }
 if(e.key==='Escape')closeModal();
});
/* drag & drop */
document.addEventListener('dragstart',e=>{
 const tile=e.target.closest('.item[data-id]');
 if(tile)e.dataTransfer.setData('text/plain',tile.dataset.id);
});
document.addEventListener('dragover',e=>{
 const z=e.target.closest('[data-drop]');
 if(z){e.preventDefault();z.classList.add('dragover');}
});
document.addEventListener('dragleave',e=>{
 const z=e.target.closest('[data-drop]');
 if(z)z.classList.remove('dragover');
});
document.addEventListener('drop',e=>{
 const z=e.target.closest('[data-drop]');
 if(!z)return;
 e.preventDefault();z.classList.remove('dragover');
 const id=e.dataTransfer.getData('text/plain');
 if(id&&moveItem(id,z.dataset.drop)){save();renderAll();toast('Transferred');}
});

initState();
renderAll();
</script>
</body>
</html>
